<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFrame AI - Gaming FPS Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0e14;
            color: #e0e6ed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background-color: #151c28;
            border: 1px solid #232d3f;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .btn-neon {
            background-color: #00f2fe;
            color: #000;
            font-weight: bold;
            border: none;
            transition: 0.3s ease;
        }
        .btn-neon:hover {
            background-color: #4facfe;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        .fps-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #00f2fe;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-uppercase tracking-wider">🎮 GameFrame <span style="color: #00f2fe;">AI</span></h1>
            <p class="text-muted">Smart ML Hardware FPS & Performance Predictor</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <form action="/predict" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Game Select Karein</label>
                            <select name="game" class="form-select bg-dark text-light border-secondary">
                                <option value="GTA 5">GTA 5</option>
                                <option value="Tekken 8">Tekken 8</option>
                                <option value="Cyberpunk 2077">Cyberpunk 2077</option>
                                <option value="Valorant">Valorant</option>
                                <option value="Red Dead Redemption 2">Red Dead Redemption 2</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Resolution</label>
                            <select name="resolution" class="form-select bg-dark text-light border-secondary">
                                <option value="1080p">1080p (Full HD)</option>
                                <option value="1440p">1440p (2K)</option>
                                <option value="4K">4K (Ultra HD)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">GPU Benchmark Score (e.g. MX150=2200, GTX 1650=5000, RTX 3060=8500)</label>
                            <input type="number" name="gpu_score" class="form-control bg-dark text-light border-secondary" value="5000" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CPU Cores</label>
                                <input type="number" name="cpu_cores" class="form-control bg-dark text-light border-secondary" value="6" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">RAM (GB)</label>
                                <input type="number" name="ram_gb" class="form-control bg-dark text-light border-secondary" value="16" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-neon w-100 py-2 mt-3">PREDICT FPS ⚡</button>
                    </form>

                    {% if result %}
                    <hr class="border-secondary my-4">
                    <div class="text-center">
                        <p class="mb-1 text-uppercase text-muted small">Estimated Frame Rate for {{ result.game }} ({{ result.resolution }})</p>
                        <div class="fps-display">{{ result.fps }} <span style="font-size: 1.5rem;">FPS</span></div>
                        <span class="badge bg-{{ result.badge }} mt-2 px-3 py-2 fs-6">{{ result.status }}</span>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
